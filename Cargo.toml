[workspace] 

[package]
name = "cockatiel-engine-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
cockatiel-proto = { git = "https://github.com/vulbyte/cockatiel_proto", rev = "1f5a3bfc60268a102d441d5ab42551c77908bc0a" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
turso = "0.1.0"

uuid = { version = "1.0", features = ["v7", "fast-rng"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

prost = "0.14"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"

[build-dependencies]
prost-build = "0.14"
