syntax = "proto3";

// ==========================================
// ENGINE MODULE PROTOCOL
// ==========================================
// This protocol is engine-owned. It is the home for the timeline /
// user-database query capability that the engine exposes, modelled
// as a closed set of operations instead of an open-ended `query_id`
// string that the engine dispatches on.
//
// The shared module protocol (`cockatiel_protobuf.v1`) still carries
// the wire traffic today. This file is the destination for it, and
// it is deliberately a NEW, self-contained definition: it does not
// mirror or reuse any tag numbers from `cockatiel_protobuf.proto`,
// so the two may evolve independently. Migrating the dispatcher onto
// these messages is separate work.
//
// It lives here, next to the engine, because the timeline and the
// user database are engine-internal resources — the same reasoning
// that already keeps `cockatiel_userdb.v1` in its own crate.
// ==========================================

package cockatiel_engine.v1;

// ── Operations ────────────────────────────────────────────
// The closed set of queries the engine answers. Each variant maps
// to exactly one branch of the engine's DatabaseQuery dispatcher
// (src/main.rs, `Payload::DatabaseQuery`).
//
// Numbering is grouped by family and the groups are deliberately
// sparse, so a family can grow later without renumbering — and
// therefore without breaking any value already on the wire.

enum QueryOp {
  // Unset. The engine rejects this: it means the caller did not
  // name an operation, which is the whole failure mode the closed
  // enum exists to make impossible.
  QUERY_OP_UNSPECIFIED = 0;

  // ── Engine metadata (control surface) ──
  // Backup configuration and on-disk size for the timeline and user
  // databases, so the UI can warn about data-loss risk.
  QUERY_OP_DB_STATUS = 1;
  // Discovered + registered + live modules, merged by name.
  QUERY_OP_MODULE_LIST = 2;
  // Engine port, timeline database location, and (control surface
  // only) the master PIN.
  QUERY_OP_ENGINE_INFO = 3;
  // Write another module's `.env` / `config.json` credentials.
  QUERY_OP_SET_CREDENTIALS = 4;
  // Raw rendered audio for one message, for display playback.
  QUERY_OP_AUDIO_FOR_MESSAGE = 5;

  // ── Held-for-audit queue (control surface) ──
  QUERY_OP_AUDIT_LIST = 6;
  QUERY_OP_AUDIT_APPROVE = 7;
  QUERY_OP_AUDIT_REJECT = 8;

  // ── Compliance test surface ──
  // Run the engine's compliance suite. TUI only.
  QUERY_OP_TEST_RUN = 9;
  // Round-trip a payload of a given type to one module and measure
  // the latency. TUI and test-runner only.
  QUERY_OP_TEST_PROBE = 10;
  // Insert archival rows for a compliance run. Test-runner only —
  // it goes through the engine's own insert method, never raw SQL.
  QUERY_OP_TEST_ARCHIVE = 11;

  // ── Pipeline control (control surface) ──
  // Hold or release the whole message pipeline. While held the engine
  // still ingests, parses commands and writes the timeline, but
  // dispatches nothing to any module; queued messages accumulate and
  // are replayed on release, so nothing is lost. The engine boots
  // held. Control surface only — an ordinary module must not be able
  // to stop or start the pipeline for everyone else.
  //
  // Params: `json` = {"paused": true|false} (today it arrives as the
  // legacy `sql` blob; a bool field of its own is the rewiring's job).
  QUERY_OP_PIPELINE_SET_PAUSED = 12;

  // ── Moderation (actor-verified against the user database) ──
  // Each of these requires a verified mod/admin/owner actor in
  // `params.actor`, except COMMEND/REPRIMAND which the automated
  // scorer ("score-messages") may apply on the SYSTEM path.
  QUERY_OP_MOD_COMMEND = 20;
  QUERY_OP_MOD_REPRIMAND = 21;
  QUERY_OP_MOD_BAN = 22;
  QUERY_OP_MOD_TIMEOUT = 23;

  // ── Chat-command ratings ──
  // Any verified user may rate another; no mod status required. The
  // 24h reprimand cooldown is enforced in the user database.
  QUERY_OP_CHAT_COMMEND = 30;
  QUERY_OP_CHAT_REPRIMAND = 31;
  // Identity bootstrap / write-through. term-chat only.
  QUERY_OP_CHAT_VERIFY_IDENTITY = 32;

  // ── User database (engine-internal) ──
  // Control surface only; modules are denied.
  QUERY_OP_USERDB_ADD_USER = 40;
  QUERY_OP_USERDB_DELETE_USER = 41;
  QUERY_OP_USERDB_ADD_SCORE = 42;
  QUERY_OP_USERDB_REMOVE_SCORE = 43;
  QUERY_OP_USERDB_ADD_CHANNEL = 44;
  QUERY_OP_USERDB_REMOVE_CHANNEL = 45;
  QUERY_OP_USERDB_GET_USER = 46;
  QUERY_OP_USERDB_LIST_USERS = 47;
  QUERY_OP_USERDB_UPDATE_FLAGS = 48;
  QUERY_OP_USERDB_SET_ROLES = 49;
  QUERY_OP_USERDB_READ_USER_VALUE = 50;
  QUERY_OP_USERDB_WRITE_USER_VALUE = 51;
  QUERY_OP_USERDB_DELETE_USER_VALUE = 52;
  QUERY_OP_USERDB_LIST_USER_VALUES = 53;
  QUERY_OP_USERDB_COMMENDATION = 54;
  QUERY_OP_USERDB_REPRIMAND = 55;
  QUERY_OP_USERDB_BAN = 56;
  QUERY_OP_USERDB_TIMEOUT = 57;
  // Arbitrary signed score delta that bypasses both the ±1 clamp and
  // the user database's rating cooldown. Control surface and
  // score-messages only.
  QUERY_OP_USERDB_ADJUST_SCORE = 58;

  // ── Engine lifecycle (control surface) ──
  // Ask the engine to shut down. Control surface only — an ordinary module
  // (and the compliance test runner, which must not be able to kill the engine
  // that is timing it) is refused by the gate.
  //
  // The engine decides FOR ITSELF whether to honour this: the operation is
  // only acted on when the engine's own `shutdown_on_request` config flag is
  // true. A request that arrives on an engine that has never heard of the flag
  // is refused with an error naming the key, and the engine keeps running — a
  // stray or hostile request cannot kill a process it merely talks to.
  //
  // When it IS permitted, the engine answers first and exits second, so the
  // caller learns whether its request was accepted instead of finding a dead
  // socket.
  //
  // 60 opens a NEW decade rather than taking a number from an existing group:
  // 1-12 is the control-surface band and is fully allocated (metadata 1-5,
  // audit 6-8, compliance 9-11, pipeline 12), 20-58 belong to moderation, chat
  // ratings and the user database, and 59 is left free so a userdb addition
  // (that family already spans two decades) can never collide with this one.
  // Nothing at or below 58 moves, so no value already on the wire changes.
  QUERY_OP_ENGINE_SHUTDOWN = 60;

  // ── Predictions ─────────────────────────────────────────
  // The predictions module's read surface. The brain (the "predictions"
  // module) reads a user's current score before placing a bet; the control
  // surface may do the same.
  //
  // 70 opens a NEW decade rather than taking a number from an existing group:
  // 61-69 is the engine-lifecycle family's growth room, and nothing at or
  // below 60 moves, so no value already on the wire changes.
  QUERY_OP_PREDICTION_GET_SCORE = 70;

  // Read the engine's in-memory per-channel viewer/member counts, as pushed
  // by the platform adapters. Open to every authenticated module — public
  // stream data.
  QUERY_OP_CHANNEL_VIEWERS = 71;

  // ── Read-only SQL escape hatch ──
  // The engine's final fallback for any query that is not one of the
  // named operations above. Hard read-only boundary: only
  // SELECT/EXPLAIN may run. Any write must go through the engine's
  // own methods or a named operation, never through here.
  QUERY_OP_SELECT_SQL = 90;
}

// ── Data model ────────────────────────────────────────────

// The human who triggered a moderation action, as resolved by the
// engine against the user database before the action is applied.
// Absent means the SYSTEM path, which only the automated scorer may
// use, and only for COMMEND/REPRIMAND.
message ActorRef {
  string uuid7 = 1;         // preferred; resolves directly
  string platform = 2;      // fallback: resolve by (platform, handle)
  string handle = 3;
}

// Parameters for an operation.
//
// The operations do not all need the same thing, so rather than a
// per-operation message (which would be a large, mostly-unused
// schema) this is one flat bag. An operation ignores what it does
// not use, and each field below names the operations that read it.
// `json` is the escape hatch for the operation families that are
// still opaque — see the note on that field.
message QueryParams {
  // QUERY_OP_SELECT_SQL only. Must be read-only SQL.
  string sql = 1;

  // Target user. Either `uuid7`, or `platform` + (`channel_id` or
  // `handle`) to resolve one. Used by the moderation, chat-rating
  // and user-database families.
  string uuid7 = 2;
  string platform = 3;
  string channel_id = 4;
  string handle = 5;

  // Human-readable justification, recorded with the action.
  string reason = 6;

  // MOD_TIMEOUT / USERDB_TIMEOUT. 0 means the engine's default.
  int64 duration_secs = 7;

  // AUDIT_LIST / USERDB_LIST_USERS. 0 means the engine's default.
  int64 limit = 8;
  int64 offset = 9;

  // SET_CREDENTIALS: the module whose credentials are being written.
  string module_name = 10;

  // TEST_ARCHIVE: groups the inserted rows into one run.
  string batch_uuid = 11;

  // The verified actor for the moderation family. Unset means the
  // SYSTEM path — which the engine accepts only from the automated
  // scorer, and only for MOD_COMMEND / MOD_REPRIMAND.
  ActorRef actor = 12;

  // OPAQUE escape hatch — deliberately unstructured for now.
  //
  // The `mod_*` and `userdb_*` families carry a JSON blob today, with
  // each operation reading its own keys out of it. Those operations
  // are not modelled field-by-field here on purpose: this is a
  // skeleton, and giving each of the ~22 of them real messages would
  // be a port, not a landing. A later change fills each one in and
  // retires this field.
  //
  // Callers that already speak the JSON blob keep working by putting
  // it here. The engine MUST NOT assume it parses: a malformed blob
  // is a request error, not a panic.
  string json = 13;
}

// The result of an operation.
//
// Likewise a placeholder. The engine returns JSON-encoded results
// for almost everything today, so `result_blob` is where those bytes
// go unchanged, and QUERY_OP_AUDIO_FOR_MESSAGE puts raw audio there
// instead. Typing the common shapes (a module list, an audit page, a
// user record) is the later workstream's job.
message QueryResult {
  // JSON-encoded result, or raw bytes for AUDIO_FOR_MESSAGE. Empty
  // when the operation has no result (e.g. a successful write).
  bytes result_blob = 1;
}

// ── Requests ──────────────────────────────────────────────

message QueryRequest {
  /*
   * expected behavior:
   * unauthed: sever connection immediately
   * authed: module: pick `operation`, fill `params`, and expect
   *   exactly one QueryResponse carrying the same `request_id`
   * authed: engine: run the operation and answer it; an operation
   *   the caller is not permitted to run is an error response, not
   *   a severed connection
   */

  // Correlation id, echoed back on the response so a module can have
  // several queries in flight and match each answer to its request.
  //
  // Note this is a genuinely new concept: the shared protocol's
  // `query_id` is not one — the engine uses that field to select the
  // operation and echoes it back verbatim, so today a module cannot
  // correlate concurrent queries at all.
  string request_id = 1;

  // Required. QUERY_OP_UNSPECIFIED is always an error.
  QueryOp operation = 2;

  QueryParams params = 3;
}

// ── Responses ─────────────────────────────────────────────

message QueryResponse {
  /*
   * expected behavior:
   * unauthed: sever connection immediately
   * authed: engine: send exactly one of these per QueryRequest,
   *   whether the operation succeeded, was denied, or failed
   * authed: module: match on `request_id`, then read `result` only
   *   when `success` is true — on failure `error` is the only
   *   meaningful field and `result` is unset
   */

  // Echoes QueryRequest.request_id.
  string request_id = 1;

  // Echoes QueryRequest.operation, so a module can tell which
  // in-flight query an answer belongs to even if it ignored ids.
  QueryOp operation = 2;

  bool success = 3;
  string error = 4;         // human-readable, set only on failure

  QueryResult result = 5;
}
